<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CozyOS — Administrator</title>
<style>
  html, body { margin: 0; padding: 0; background: #011c15; color: #eaf5ee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100%; }
  #cozy-admin-gate-screen { display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 24px; box-sizing: border-box; }
  #cozy-admin-gate-status { font-size: 14px; color: #9fd6ae; }
  #cozy-admin-denied { display: none; max-width: 420px; }
  #cozy-admin-denied h2 { margin: 0 0 8px 0; color: #fff; }
  #cozy-admin-denied p { font-size: 13px; color: #94a3b8; margin: 0 0 16px 0; }
  #cozy-admin-denied a { color: #81C784; }
</style>
</head>
<body>
<div id="cozy-admin-gate-screen">
  <p id="cozy-admin-gate-status">Verifying administrator access…</p>
  <div id="cozy-admin-denied">
    <h2>Access Denied</h2>
    <p>You do not have administrator access to this workspace.</p>
    <a href="index.html">Return to CozyOS</a>
  </div>
</div>

<!-- Real, minimal identity dependency set - only what's needed to run the
     real authorization check below, before anything else loads. The full
     administrator workspace itself is loaded afterward via the existing,
     real Bootstrap mechanism (core/bootstrap/bootstrap.js), which composes
     dashboard.html's own real script sequence - never a second, duplicated
     copy of it maintained here. -->
<script src="core/shell/platform-event-bus.js"></script>
<script src="core/modules/identity/identity-engine.js"></script>
<script src="core/modules/identity/auth-coordinator.js"></script>
<script src="core/bootstrap/bootstrap.js"></script>
<script>
(function () {
  const statusEl = document.getElementById("cozy-admin-gate-status");
  const deniedEl = document.getElementById("cozy-admin-denied");

  async function checkAndProceed() {
    const auth = window.CozyOS && window.CozyOS.AuthCoordinator;
    const identity = window.CozyOS && window.CozyOS.IdentityEngine;
    if (!auth || !identity) {
      statusEl.textContent = "CozyOS Identity services failed to load.";
      return;
    }

    // Real, honest session restore attempt - same real mechanism
    // cozy-login-gate.js already uses elsewhere in this codebase.
    if (typeof auth.restoreSession === "function") {
      try { await auth.restoreSession(); } catch (_err) { /* honest no-op */ }
    }

    if (!auth.isAuthenticated()) {
      window.location.href = "login.html";
      return;
    }

    // Real, explicit authorization check. Chalzydashboard.html never
    // relies on being hidden by its filename - it always verifies, per
    // the requirement, using the real, confirmed checkResourcePermission()
    // (not the hypothetical getCurrentSession()/hasPermission() names -
    // verified against the actual IdentityEngine source before writing
    // this file).
    const identityResult = auth.getCurrentIdentity();
    const userId = identityResult && identityResult.userId;
    const isAdmin = userId && (
      (typeof identity.isPlatformAdmin === "function" && identity.isPlatformAdmin(userId)) ||
      (typeof identity.checkResourcePermission === "function" && identity.checkResourcePermission(userId, "admin:dashboard"))
    );

    if (!isAdmin) {
      statusEl.style.display = "none";
      deniedEl.style.display = "block";
      return;
    }

    statusEl.textContent = "Loading administrator workspace…";
    const result = await window.CozyOS.Bootstrap.start();
    if (!result.success) {
      statusEl.textContent = "Failed to load: " + result.reason;
    }
    // On success, Bootstrap.start() itself replaces document.body content
    // with dashboard.html's real body and runs its real script sequence -
    // no further action needed here.
  }

  checkAndProceed();
})();
</script>
</body>
</html>
