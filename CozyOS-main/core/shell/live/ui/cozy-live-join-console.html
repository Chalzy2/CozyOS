<!DOCTYPE html>
<!--
  core/shell/live/ui/cozy-live-join-console.html
  STEP 4D / LIVE UI / PART B — DIRECT JOIN

  Minimal, single-purpose Join Live surface. The viewer must already
  possess a legitimate LDCE sessionId (shared out-of-band) — no
  discovery, browsing, or listing exists or is implied here. See
  COS-STEP4D-LIVE-UI-PATCH-2-AUDIT.zip for why: no production
  session-discovery mechanism exists anywhere in this repository.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CozyOS — Join Live</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#0f1115; color:#e8eaed; margin:0; padding:32px 16px; }
  .card { max-width:420px; margin:0 auto; background:#1a1d24; border-radius:12px; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { color:#9aa0a6; font-size:13px; margin:0 0 20px; }
  label { display:block; font-size:12px; color:#9aa0a6; margin-bottom:6px; }
  input#session-id-input { width:100%; box-sizing:border-box; padding:12px; font-size:14px; border-radius:8px; border:1px solid #3c4043; background:#111318; color:#e8eaed; margin-bottom:12px; }
  button#join-live-btn { width:100%; padding:14px; font-size:15px; font-weight:600; border:none; border-radius:8px; background:#1a73e8; color:#fff; cursor:pointer; }
  button#join-live-btn:disabled { background:#3c4043; cursor:not-allowed; }
  #join-live-status { margin-top:16px; font-size:13px; line-height:1.5; }
  #join-live-status[data-state="joined"] { color:#81c995; }
  #join-live-status[data-state="error"],
  #join-live-status[data-state="unauthenticated"],
  #join-live-status[data-state="unavailable"],
  #join-live-status[data-state="missing-session-id"] { color:#f28b82; }
</style>
</head>
<body>
  <div class="card">
    <h1>Join Live</h1>
    <p class="sub">Enter a live session ID to join.</p>
    <label for="session-id-input">Session ID</label>
    <input id="session-id-input" type="text" autocomplete="off" placeholder="e.g. ldce-session-...">
    <button id="join-live-btn" type="button">Join Live</button>
    <div id="join-live-status" role="status"></div>

    <!-- STEP 4D / LIVE UI, PART F — minimal viewer media. Viewer never publishes its own camera/mic; this only receives the host's stream. -->
    <div id="viewer-media-panel" hidden style="margin-top:20px;border-top:1px solid #3c4043;padding-top:16px;">
      <video id="viewer-remote-video" autoplay playsinline style="width:100%;border-radius:8px;background:#000;"></video>
      <div id="viewer-media-status" role="status" style="margin-top:10px;font-size:13px;line-height:1.5;">Connecting…</div>
      <button id="leave-media-btn" type="button" style="width:100%;margin-top:8px;padding:12px;font-size:14px;font-weight:600;border:none;border-radius:8px;background:#3c4043;color:#fff;cursor:pointer;">Leave</button>
    </div>
  </div>

  <script src="../../../modules/session/firebase-session-bridge.js"></script>
  <script src="../../../modules/communication/ldce-session-engine.js"></script>
  <script src="../../../modules/communication/ldce-media-session-engine.js"></script>
  <script src="../live-relay-composition-bridge.js"></script>
  <script src="../live-entry-point.js"></script>
  <script src="../ldce-live-media-coordinator.js"></script>
  <script src="cozy-live-join-console-controller.js"></script>
  <script>
  (function () {
    'use strict';
    var input = document.getElementById('session-id-input');
    var btn = document.getElementById('join-live-btn');
    var status = document.getElementById('join-live-status');
    var mediaPanel = document.getElementById('viewer-media-panel');
    var remoteVideo = document.getElementById('viewer-remote-video');
    var mediaStatus = document.getElementById('viewer-media-status');
    var leaveBtn = document.getElementById('leave-media-btn');
    var controller = window.CozyOS.LiveJoinConsoleController.createController({});
    var currentSessionId = null;
    var currentUnsubscribe = null;

    function render(state, text) {
      status.setAttribute('data-state', state);
      status.textContent = text;
    }
    function renderMedia(state, text) {
      mediaStatus.setAttribute('data-state', state);
      mediaStatus.textContent = text;
    }

    btn.addEventListener('click', function () {
      btn.disabled = true;
      render('pending', 'Joining…');
      controller.join(input.value).then(function (result) {
        btn.disabled = false;
        if (!result.success) {
          render(result.state, result.reason);
          return;
        }
        render('joined', 'Joined. Session ID: ' + result.sessionId);
        currentSessionId = result.sessionId;
        mediaPanel.hidden = false;
        renderMedia('connecting', 'Connecting to host media…');
        return controller.handleJoinMedia(currentSessionId, remoteVideo, {
          onConnectionFailed: function () {
            renderMedia('connect-failed', 'Connection to host lost. Leave and rejoin to try again.');
          },
        });
      }).then(function (mediaResult) {
        if (!mediaResult) return;
        if (!mediaResult.success) {
          renderMedia(mediaResult.state, mediaResult.reason);
          return;
        }
        currentUnsubscribe = mediaResult.unsubscribe;
        renderMedia('connecting', 'Connected — waiting for host video…');
      }).catch(function (err) {
        btn.disabled = false;
        render('error', 'Unexpected error: ' + (err && err.message ? err.message : String(err)));
      });
    });

    leaveBtn.addEventListener('click', function () {
      if (!currentSessionId) return;
      controller.handleLeaveMedia(currentSessionId, currentUnsubscribe);
      remoteVideo.srcObject = null;
      renderMedia('stopped', 'Left.');
    });
  })();
  </script>
</body>
</html>
