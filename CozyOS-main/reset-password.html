<!-- reset-password.html
     BUG FIX (confirmed during the User Security Surface audit):
     server/webauthn-rp/server.js's POST /auth/password/forgot has
     always emailed a link to `${origin}/reset-password.html?token=...`
     (see that route's own resetUrl construction), but no
     reset-password.html file existed anywhere in this repository —
     every emailed reset link 404'd. login.html's own "Forgot Password?"
     modal already has a real, working confirm step (paste-the-token),
     so this page is deliberately the SMALLEST possible surface that
     makes the emailed link itself work: it reads ?token= from the URL,
     collects a new password, and calls the exact same existing,
     already-tested endpoint login.html's modal calls — POST
     /auth/password/reset with {token, newPassword} — using the exact
     same error-code -> message mapping login.html already uses. No new
     backend route, no new validation, no second reset mechanism. This
     affects the admin and ordinary-user reset flow identically (the
     endpoint has never distinguished between them) — pre-existing admin
     behavior is unchanged since admin never had a working link either,
     and admin's own reset UI already goes through login.html's modal,
     never through this page. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — CozyOS</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#0A0A0A; color:#fff; }
  .cozy-reset-card { width:100%; max-width:380px; margin:24px; padding:28px; border-radius:14px;
    background:#141414; border:1px solid #222222; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
  .cozy-reset-card h1 { margin:0 0 6px 0; font-size:20px; color:#FFD700; text-align:center; }
  .cozy-reset-card p.cozy-reset-sub { margin:0 0 20px 0; font-size:13px; color:#aaa; text-align:center; }
  .cozy-reset-card label { display:block; font-size:12px; color:#FFD700; text-transform:uppercase;
    letter-spacing:1px; margin:14px 0 6px 0; }
  .cozy-reset-card input { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px;
    border:1px solid #333; background:#0f0f0f; color:#fff; font-size:14px; }
  .cozy-reset-card input:focus { outline:none; border-color:#00C853; }
  #cozy-reset-submit { width:100%; margin-top:20px; padding:11px; border-radius:10px; border:none;
    background:#F9A825; color:#0A0A0A; font-weight:700; font-size:14px; cursor:pointer; }
  #cozy-reset-submit:disabled { opacity:0.6; cursor:not-allowed; }
  .cozy-reset-error, .cozy-reset-success { display:none; margin-top:14px; padding:10px 12px;
    border-radius:8px; font-size:13px; text-align:center; }
  .cozy-reset-error { background:#2b0606; border:1px solid #ff5252; color:#ff8a8a; }
  .cozy-reset-success { background:#062b13; border:1px solid #00C853; color:#7CFFB2; }
  .cozy-reset-back { display:block; text-align:center; margin-top:18px; color:#F9A825;
    text-decoration:none; font-size:13px; }
  .cozy-reset-back:hover { text-decoration:underline; }
  .cozy-reset-token-note { font-size:11px; color:#777; text-align:center; margin-top:4px; }
</style>
</head>
<body>
<div class="cozy-reset-card">
  <h1>Reset Your Password</h1>
  <p class="cozy-reset-sub">Enter a new password for your account. This link is single-use and expires 15 minutes after it was requested.</p>

  <form id="cozy-reset-form" autocomplete="off">
    <label for="cozy-reset-token">Reset token</label>
    <input id="cozy-reset-token" type="text" autocomplete="off">
    <p class="cozy-reset-token-note" id="cozy-reset-token-note"></p>

    <label for="cozy-reset-newpass">New Password</label>
    <input id="cozy-reset-newpass" type="password" autocomplete="new-password">

    <label for="cozy-reset-confirm">Confirm New Password</label>
    <input id="cozy-reset-confirm" type="password" autocomplete="new-password">

    <button type="submit" id="cozy-reset-submit">Reset Password</button>
  </form>

  <p class="cozy-reset-error" id="cozy-reset-error"></p>
  <p class="cozy-reset-success" id="cozy-reset-success"></p>

  <a class="cozy-reset-back" href="login.html">Back to sign in</a>
</div>

<script>
(function () {
  "use strict";

  // Real token pickup from the emailed link's own querystring
  // (?token=...), exactly as server.js's resetUrl construction emits
  // it. Deliberately avoids the URLSearchParams global's edge cases the
  // same way login.html's own query parsing does, but URLSearchParams
  // is broadly supported enough for this dedicated page to use it
  // directly.
  function getTokenFromUrl() {
    try {
      var params = new URLSearchParams(window.location.search || "");
      return params.get("token") || "";
    } catch (_err) {
      return "";
    }
  }

  var tokenInput = document.getElementById("cozy-reset-token");
  var tokenNote = document.getElementById("cozy-reset-token-note");
  var urlToken = getTokenFromUrl();
  if (urlToken) {
    tokenInput.value = urlToken;
    tokenNote.textContent = "Token pre-filled from your reset link.";
  } else {
    tokenNote.textContent = "No token found in the link — paste the token from your reset email.";
  }

  var form = document.getElementById("cozy-reset-form");
  var submitBtn = document.getElementById("cozy-reset-submit");
  var errEl = document.getElementById("cozy-reset-error");
  var okEl = document.getElementById("cozy-reset-success");

  // Same real error-code -> message mapping login.html's own
  // "I already have a reset token" confirm step already uses for this
  // exact endpoint — kept identical on purpose, not re-derived.
  var ERROR_MESSAGES = {
    invalid_reset_token: "That reset token isn't valid. Request a new one.",
    reset_token_already_used: "That reset token has already been used. Request a new one.",
    reset_token_expired: "That reset token has expired. Request a new one.",
    password_too_short: "Choose a password at least 8 characters long.",
    token_and_new_password_required: "Reset token and new password are required.",
  };

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    errEl.style.display = "none";
    okEl.style.display = "none";

    var token = tokenInput.value.trim();
    var pw = document.getElementById("cozy-reset-newpass").value;
    var confirm = document.getElementById("cozy-reset-confirm").value;

    if (!token || !pw) {
      errEl.textContent = "Reset token and new password are required.";
      errEl.style.display = "block";
      return;
    }
    if (pw !== confirm) {
      errEl.textContent = "Passwords do not match.";
      errEl.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    try {
      // The one real, existing reset backend — no parallel mechanism.
      var res = await fetch("/auth/password/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ token: token, newPassword: pw }),
      });
      var body = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        errEl.textContent = ERROR_MESSAGES[body.error] || "Reset failed. Check the token and try again.";
        errEl.style.display = "block";
        submitBtn.disabled = false;
        return;
      }
      okEl.textContent = "Password reset. All other sessions were signed out. You can sign in now.";
      okEl.style.display = "block";
      form.style.display = "none";
    } catch (_err) {
      errEl.textContent = "Reset failed. Please try again later.";
      errEl.style.display = "block";
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
