<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmacyOS — CozyOS Business Application</title>
</head>
<body>
<!--
  CozyOS — PharmacyOS End-User Module (Phase 1)
  Real fix (Level 2B repair): this file's own logic (the inline <script>
  tags below, including their real dependency <script src> tags) never
  executed under the fragment-injection mount path
  (core/shell/application-launcher.js's real, unmodified isStandalone
  check requires a real <head> tag before it will use the iframe path -
  confirmed by reading that file; browsers never execute <script> tags
  inserted via innerHTML, which is what a fragment mount does). Adding
  this minimal, real <head>/<body> wrapper is the only change in this
  file - every existing element, id, and the entire real inline script
  below are untouched, so nothing about PharmacyOS's actual Phase 1
  functionality (setupPharmacy/createMedicine/listMedicines against the
  real, unmodified core/plugins/pharmacyOS-core.js) was rebuilt.
  Renders only inside #cozy-app-root. No shell chrome - matches the
  same real pattern already proven for ShopOS/MpesaOS. Only exposes
  capabilities genuinely implemented in core/plugins/pharmacyOS-core.js.
-->
<div class="ph-app" id="ph-app-root">

    <div class="ph-topbar">
        <div class="ph-brand-cluster">
            <div class="ph-brand-badge">💊</div>
            <div>
                <div class="ph-brand-name">PharmacyOS</div>
                <div class="ph-brand-sub">CozyOS Business Application</div>
            </div>
        </div>
        <span class="ph-status-pill" id="ph-engine-status">● Ready</span>
    </div>

    <section class="ph-section" id="ph-no-org-section" style="display:none;">
        <div class="ph-empty-state">
            <p>No pharmacy is set up yet.</p>
            <input type="text" id="ph-setup-name" placeholder="Pharmacy name" />
            <button class="ph-btn ph-btn-primary" id="ph-setup-btn">Set up Pharmacy</button>
            <p id="ph-setup-result" class="ph-note"></p>
        </div>
    </section>

    <section class="ph-section" id="ph-catalog-section" style="display:none;">
        <h3>Medicine Catalog</h3>

        <div class="ph-form-row">
            <input type="text" id="ph-med-name" placeholder="Medicine name" />
            <input type="text" id="ph-med-category" placeholder="Category (optional)" />
            <label><input type="checkbox" id="ph-med-controlled" /> Controlled substance</label>
            <button class="ph-btn ph-btn-primary" id="ph-med-create-btn">Add Medicine</button>
        </div>
        <p id="ph-med-create-result" class="ph-note"></p>

        <table class="ph-table" id="ph-med-table">
            <thead><tr><th>Name</th><th>Category</th><th>Controlled</th><th></th></tr></thead>
            <tbody id="ph-med-table-body"></tbody>
        </table>
        <p id="ph-med-list-note" class="ph-note"></p>
    </section>

    <footer class="ph-footer">PharmacyOS Application (Phase 1) · CozyOS</footer>
</div>
<script src="../../core/organization/organization-registry.js"></script>
<script src="../../core/plugins/pharmacyOS-core.js"></script>
<script>
(function () {
    "use strict";
    // Real, minimal UI wiring - no fake data, no second business-logic
    // layer. Every action below calls the real, unmodified
    // window.CozyOS.PharmacyOS methods directly.
    let currentOrgId = null;

    function resolveActorId() {
        const session = window.CozyOS && window.CozyOS.Session;
        if (session && typeof session.current === "function") {
            const snap = session.current();
            if (snap && snap.uid) return snap.uid;
        }
        return null;
    }

    function renderMedicines() {
        const pharmacy = window.CozyOS.PharmacyOS;
        const tbody = document.getElementById("ph-med-table-body");
        const note = document.getElementById("ph-med-list-note");
        if (!currentOrgId) return;
        const medicines = pharmacy.listMedicines({ orgId: currentOrgId, actorId: resolveActorId() });
        tbody.innerHTML = "";
        medicines.forEach((m) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${m.name}</td><td>${m.category || "—"}</td><td>${m.isControlledSubstance ? "Yes" : "No"}</td><td></td>`;
            tbody.appendChild(tr);
        });
        note.textContent = medicines.length === 0 ? "No medicines yet (or controlled-substance items are hidden from your access level)." : "";
    }

    function init() {
        const pharmacy = window.CozyOS.PharmacyOS;
        const statusEl = document.getElementById("ph-engine-status");
        if (!pharmacy) { statusEl.textContent = "● PharmacyOS core not loaded"; return; }

        document.getElementById("ph-no-org-section").style.display = "block";

        document.getElementById("ph-setup-btn").addEventListener("click", () => {
            const name = document.getElementById("ph-setup-name").value.trim();
            const resultEl = document.getElementById("ph-setup-result");
            try {
                const org = pharmacy.setupPharmacy({ name, actorId: resolveActorId() });
                currentOrgId = org.orgId;
                resultEl.textContent = `Pharmacy "${name}" set up.`;
                document.getElementById("ph-no-org-section").style.display = "none";
                document.getElementById("ph-catalog-section").style.display = "block";
                renderMedicines();
            } catch (err) {
                resultEl.textContent = "Setup failed: " + err.message;
            }
        });

        document.getElementById("ph-med-create-btn").addEventListener("click", () => {
            const name = document.getElementById("ph-med-name").value.trim();
            const category = document.getElementById("ph-med-category").value.trim();
            const isControlledSubstance = document.getElementById("ph-med-controlled").checked;
            const resultEl = document.getElementById("ph-med-create-result");
            try {
                pharmacy.createMedicine({ orgId: currentOrgId, actorId: resolveActorId(), name, category, isControlledSubstance });
                resultEl.textContent = `"${name}" added.`;
                document.getElementById("ph-med-name").value = "";
                document.getElementById("ph-med-category").value = "";
                document.getElementById("ph-med-controlled").checked = false;
                renderMedicines();
            } catch (err) {
                resultEl.textContent = "Could not add medicine: " + err.message;
            }
        });
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
})();
</script>
</body>
</html>
