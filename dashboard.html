<script>
  // M366.8 — Emergency Bootstrap Recovery: defensive-only fix. No code
  // in this repository currently calls navigator.serviceWorker.register()
  // anywhere (confirmed by repository-wide search before this was
  // added) - so this never registers anything new. It only unregisters
  // a service worker that may already be installed in a returning
  // visitor's browser from an earlier deployment (sw.js/PWA/sw.js exist
  // in this repository and are real, functional PWA files - if either
  // was ever registered by a past version of this site, it would keep
  // serving its own previously-cached content indefinitely, since it
  // was never version-bumped before this milestone). This runs before
  // anything else so a stale worker cannot intercept the requests the
  // real launch sequence below depends on.
  if (typeof navigator !== "undefined" && navigator.serviceWorker && typeof navigator.serviceWorker.getRegistrations === "function") {
    navigator.serviceWorker.getRegistrations().then((regs) => {
      regs.forEach((reg) => reg.unregister());
    }).catch(() => { /* real, honest no-op - nothing to clean up or the API isn't available */ });
  }

  // M364.3: routing (login.html redirect, or the signed-in placeholder)
  // is gated entirely behind the real "cozy:launch-sequence-complete"
  // event — this script does nothing until that fires (or the bounded
  // fallback below elapses). The real auth check (M364.2, unchanged in
  // substance) still runs in parallel so it's ready the moment the
  // sequence finishes, but its RESULT is never acted on early.
  (function () {
    const errorEl = document.getElementById("cozy-startup-error");

    function mountUserDashboard(userId) {
      const screen = document.getElementById("cozy-launch-screen");
      if (!screen) return;
      screen.classList.add("cozy-launch-hidden");
      setTimeout(() => {
        // M365.0: the honest "not built yet" placeholder is replaced by
        // the real, composed User Dashboard (core/shell/user-dashboard.js).
        // Same real fade-out of the launch screen as before; only what
        // replaces it has changed.
        screen.innerHTML = "";
        screen.classList.remove("cozy-launch-hidden");
        // REAL BUG FIX (Level 1 Universal Intelligence slice — found via
        // real-browser smoke testing, not assumed): core/shell/
        // launch-sequence.css sets #cozy-launch-screen to
        // position:fixed; z-index:999999 for the Stage 1-6 launch
        // animation, and nothing ever lowered it again once the real
        // User Dashboard is mounted inside this same element. Every
        // other real, independently fixed-position CozyOS surface that
        // is appended elsewhere in the document (Live View Controller
        // 998000, Living Assistant 999998, the Window Manager root that
        // every application window mounts into at 9000) was therefore
        // permanently trapped beneath this container - reproduced,
        // diagnosed via document.elementFromPoint(), and confirmed to
        // predate this slice (present in the untouched checkpoint).
        // The launch screen's job is genuinely finished at this exact
        // point (content has just been replaced with the real
        // dashboard), so this resets it to a normal stacking level
        // rather than leaving a completed overlay permanently on top of
        // real, interactive UI. Not a new engine, not a workaround -
        // the launch screen is not touched at all before this point,
        // and its own animation/hide behavior (cozy-launch-hidden) is
        // unchanged.
        screen.style.zIndex = "auto";
        const dashboard = window.CozyOS && window.CozyOS.UserDashboard;
        if (dashboard && typeof dashboard.render === "function") {
          dashboard.render(screen, userId);
        } else {
          // Honest fallback if the real module somehow failed to load -
          // never fabricate a working dashboard in its place.
          screen.innerHTML = `<p style="color:#9fd6ae;text-align:center;margin-top:60px;">Signed in${userId ? " as " + String(userId).replace(/</g, "&lt;") : ""}. The dashboard failed to load - please refresh.</p>`;
        }
      }, 600);
    }

    async function resolveAuthState() {
      const auth = window.CozyOS && window.CozyOS.AuthCoordinator;
      if (!auth) return { authenticated: false };
      // M373 — real, confirmed fix: IdentityEngine.restorePersistedUsers()
      // (rehydrates #users from the real IdentityStorage/IndexedDB layer)
      // existed but was never called anywhere in this repository,
      // confirmed by exhaustive search. Without it, restoreSession()'s
      // own fallback path (which looks up this.#users.get(userId)) would
      // always fail even with a correctly-stored Remember Me pointer,
      // since #users starts empty on every fresh page load.
      const identity = window.CozyOS && window.CozyOS.IdentityEngine;
      if (identity && typeof identity.restorePersistedUsers === "function") {
        try { await identity.restorePersistedUsers(); } catch (_err) { /* honest no-op */ }
      }
      if (typeof auth.restoreSession === "function") {
        try { await auth.restoreSession(); } catch (_err) { /* honest no-op */ }
      }
      const authenticated = typeof auth.isAuthenticated === "function" && auth.isAuthenticated();
      if (!authenticated) return { authenticated: false };
      const identityResult = typeof auth.getCurrentIdentity === "function" ? auth.getCurrentIdentity() : null;
      return { authenticated: true, userId: identityResult && identityResult.userId };
    }

    function proceedPastSequence(authState) {
      // Per the explicit routing requirement (M364.2, unchanged): the
      // public entry never auto-mounts the Administrator Workspace,
      // authenticated or not, admin or not. M365.0: authenticated
      // visitors now see the real, composed User Dashboard instead of
      // the earlier honest placeholder; unauthenticated visitors still
      // go to the real login.html.
      if (authState && authState.authenticated) {
        mountUserDashboard(authState.userId);
      } else {
        window.location.href = "login.html";
      }
    }

    // Real auth check runs in parallel with the visible sequence -
    // never blocks or shortens it, just has its result ready in time.
    const authStatePromise = resolveAuthState().catch(() => ({ authenticated: false }));

    const bus = window.CozyOS && window.CozyOS.PlatformEventBus;
    let proceeded = false;
    function proceedOnce() {
      if (proceeded) return;
      proceeded = true;
      authStatePromise.then(proceedPastSequence);
    }

    if (bus && typeof bus.once === "function") {
      bus.once("cozy:launch-sequence-complete", proceedOnce);
      // M356 TIMING FIX — same stale-fallback bug as index.html (see
      // that file's own comment on this identical line for the full
      // real-timeline breakdown): 10000ms elapsed before the real
      // ~19.5-20s+ "cozy:launch-sequence-complete" event, so this
      // fallback — not the real event — was what actually ended the
      // sequence on every load, mid-"ABOVE ONLY", before the tagline
      // ever rendered. Raised to 30000ms, matching login.html's
      // already-correct bound for this same shared timeline.
      setTimeout(proceedOnce, 30000);
    } else {
      // PlatformEventBus or the shared sequence genuinely failed to
      // load - honest fallback so a visitor is never stuck on a green
      // screen forever, while still never skipping straight past a
      // sequence that never started.
      errorEl.style.display = "block";
      errorEl.textContent = "Startup sequence could not fully load — continuing to sign-in.";
      setTimeout(proceedOnce, 1500);
    }
  })();
</script>
