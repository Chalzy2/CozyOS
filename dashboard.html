<!DOCTYPE html>
<html lang="en" data-cozy-app="platform-admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CozyOS Enterprise</title>
    <meta name="description" content="CozyOS Enterprise — Built for Africa. Ready for the World. Intelligent offline-first enterprise platform.">
    <meta name="theme-color" content="#011c15">
    <meta name="msapplication-TileColor" content="#011c15">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="assets/branding/favicon-32.png?v=1.13.1" sizes="32x32">
    <link rel="icon" href="assets/branding/favicon-16.png?v=1.13.1" sizes="16x16">
    <link rel="shortcut icon" href="assets/branding/favicon-32.png?v=1.13.1">
    <link rel="apple-touch-icon" href="assets/branding/apple-touch-icon.png?v=1.13.1">
    <link rel="canonical" href="https://cozyos.org">
    <meta property="og:title" content="CozyOS Enterprise">
    <meta property="og:description" content="Built for Africa. Ready for the World.">
    <meta property="og:image" content="https://cozyos.org/assets/branding/cozyoslogo.png?v=1.13.1">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cozyos.org">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CozyOS Enterprise">
    <meta name="twitter:image" content="https://cozyos.org/assets/branding/cozyoslogo.png?v=1.13.1">
    <script>
    // RP-018 — defensive-only, same real snippet already present in
    // index.html/login.html since M366.8. dashboard.html is this PWA's
    // manifest start_url, so it's the *first* page a home-screen install
    // ever loads - it needs this cleanup at least as much as the other
    // two. Never registers a worker (still true repository-wide);
    // only unregisters one that may already be installed from an
    // earlier deployment. Runs before any engine script below loads.
    if (typeof navigator !== "undefined" && navigator.serviceWorker && typeof navigator.serviceWorker.getRegistrations === "function") {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((reg) => reg.unregister());
      }).catch(() => { /* real, honest no-op */ });
    }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CozyOS Enterprise",
        "url": "https://cozyos.org",
        "logo": "https://cozyos.org/assets/branding/cozyoslogo-emblem.png?v=1.13.1",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Built for Africa. Ready for the World."
    }
    </script>
    <!--
      Milestone M211F — No White Screen on Startup (permanent rule).
      This inline style is deliberately placed before every external
      stylesheet <link> below. cozy-tokens.css defines --bg-primary, but
      that file is a real network request - until it completes, the
      body has no defined background and the browser's default white
      shows through. An inline <style> block is parsed and applied
      immediately, before any network request finishes, which is the
      only way to guarantee zero white flash. Unconditional emerald
      color here, not a CSS variable, so it never depends on anything
      else loading first.
    -->
    <link rel="stylesheet" href="core/shell/launch-sequence.css">
    <!-- M364.3: this launch-screen CSS now lives in the single,
         shared core/shell/launch-sequence.css (extracted verbatim
         from what was here before — zero visual change), so
         index.html renders the identical approved launch screen. -->
    <link rel="stylesheet" href="core/living/cozy-living.css">
    <link rel="stylesheet" href="core/ui/cozy-components.css">
    <link rel="stylesheet" href="core/modules/developer/developer-hub.css">
    <!-- Milestone 132a: CozyAuthenticator, now a real dashboard.html module
         (was a standalone page at applications/Cozy-Authenticator/index.html).
         Consumes the already-loaded IdentityEngine/AuthCoordinator/
         AuthorizationCoordinator/AuthFactorRegistry/OtpProvider below —
         loads none of them itself. See MIGRATION_LOG.md. -->
    <link rel="stylesheet" href="core/modules/Cozy-Authenticator/authenticator.css">
    <style>
        /* REWORKED (visual redesign per reference design): light content
         * area with a dark navy sidebar and a proper header bar, replacing
         * the earlier dark-glass-everywhere look. Every color below reads
         * from the shared --cozy-* tokens (cozy-tokens.css's reworked
         * platform-admin block) with the same value hardcoded as a
         * fallback, so nothing breaks if tokens fail to load. */
        :root {
            --bg-primary: var(--cozy-bg-gradient, #f8fafc);
            --bg-surface: var(--cozy-glass-bg, #ffffff);
            --accent-gold: var(--cozy-brand-primary, #1B5E20);
            --accent-gold-hover: var(--cozy-brand-glow, rgba(27,94,32,0.15));
            --accent-emerald: #1B5E20;
            --emerald-glow: #00A86B;
            --text-primary: var(--cozy-text, #0f172a);
            --text-secondary: var(--cozy-muted, #475569);
            --border-color: var(--cozy-border, #E2E8F0);
            --sidebar-bg: var(--cozy-sidebar-bg, #0f172a);
            --sidebar-text: var(--cozy-sidebar-text, #e2e8f0);
            --sidebar-text-muted: var(--cozy-sidebar-text-muted, #94a3b8);
            --sidebar-hover: var(--cozy-sidebar-hover, #1e293b);
            --sidebar-active-bg: var(--cozy-sidebar-active-bg, #16A34A);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--cozy-font-family, var(--cozy-font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif));
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --------------------------------------------------------------
         * Structural CSS for cozy-workspace.js's real generated markup
         * (.cozy-shell / .cozy-sidebar / .cozy-nav-link / etc.).
         * -------------------------------------------------------------- */
        #cozy-workspace-root { min-height: 100vh; }

        .cozy-shell {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }
        /* Lowered from 768px: Chrome's "Request Desktop Site" on mobile
         * doesn't reliably override an effective viewport width above this
         * page's own width=device-width meta tag, so a higher breakpoint
         * could fail to trigger even in desktop-site mode on some devices.
         * 600px triggers reliably while still being a reasonable mobile
         * cutoff for genuinely narrow real phone viewports. */
        @media (min-width: 600px) {
            .cozy-shell { grid-template-columns: 260px 1fr; transition: grid-template-columns 0.25s cubic-bezier(0.16,1,0.3,1); }
            .cozy-shell.cozy-sidebar-collapsed { grid-template-columns: 64px 1fr; }
        }

        .cozy-sidebar-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .cozy-sidebar-toggle {
            flex: 0 0 auto; width: 28px; height: 28px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.12); background: transparent;
            color: var(--sidebar-text-muted); cursor: pointer; font-size: 13px;
        }
        .cozy-sidebar-toggle:hover { color: #fff; border-color: var(--emerald-glow); }

        /* Accordion nav sections: one open at a time via JS-driven .open class */
        .cozy-nav-section-label {
            display: flex; align-items: center; gap: 8px; width: 100%;
            background: none; border: none; cursor: pointer; text-align: left;
            color: var(--sidebar-text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 10px 12px 4px;
        }
        .cozy-nav-section-arrow { display: inline-block; font-size: 9px; transition: transform 0.15s ease; }
        .cozy-nav-section.open > .cozy-nav-section-label .cozy-nav-section-arrow { transform: rotate(90deg); }
        .cozy-nav-section-items {
            display: grid; grid-template-rows: 0fr; overflow: hidden;
            transition: grid-template-rows 0.25s cubic-bezier(0.16,1,0.3,1);
        }
        .cozy-nav-section-items > * { min-height: 0; }
        .cozy-nav-section.open > .cozy-nav-section-items { grid-template-rows: 1fr; }

        /* Collapsed: icons/labels hidden except via title tooltip, sections
         * force-expanded so items are still reachable as an icon rail. */
        .cozy-shell.cozy-sidebar-collapsed .cozy-shell-title,
        .cozy-shell.cozy-sidebar-collapsed .cozy-rediscover-btn,
        .cozy-shell.cozy-sidebar-collapsed .cozy-nav-section-label span:not(.cozy-nav-section-arrow),
        .cozy-shell.cozy-sidebar-collapsed .cozy-nav-link-label {
            display: none;
        }
        .cozy-shell.cozy-sidebar-collapsed .cozy-nav-section-items { grid-template-rows: 1fr !important; }
        .cozy-shell.cozy-sidebar-collapsed .cozy-sidebar { width: 64px; overflow-x: hidden; }
        .cozy-shell.cozy-sidebar-collapsed .cozy-nav-link { text-align: center; }

        .cozy-mobile-menu-btn {
            display: none; width: 32px; height: 32px; border-radius: 6px;
            border: 1px solid var(--border-color); background: transparent;
            color: var(--text-primary); cursor: pointer; font-size: 15px; order: -1;
        }

        .cozy-mobile-overlay { display: none; }
        @media (max-width: 599px) {
            .cozy-mobile-menu-btn { display: inline-flex; align-items: center; justify-content: center; }
            .cozy-sidebar-toggle { display: none; }
            .cozy-mobile-overlay {
                display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 25;
            }
            .cozy-sidebar {
                position: fixed; top: 0; bottom: 0; left: 0; width: 240px; z-index: 30;
                transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
            }
            .cozy-shell.cozy-sidebar-mobile-open .cozy-sidebar { transform: translateX(0); }
            .cozy-shell.cozy-sidebar-mobile-open .cozy-mobile-overlay { display: block; }
            .cozy-shell.cozy-sidebar-mobile-open .cozy-shell-title,
            .cozy-shell.cozy-sidebar-mobile-open .cozy-rediscover-btn,
            .cozy-shell.cozy-sidebar-mobile-open .cozy-nav-link-label { display: initial; }
        }

        .cozy-sidebar {
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 20px 12px;
        }
        @media (min-width: 600px) {
            .cozy-sidebar {
                border-bottom: none;
                height: 100vh;
                position: sticky;
                top: 0;
                overflow-y: auto;
            }
        }

        .cozy-shell-title {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            padding: 0 8px;
        }

        .cozy-rediscover-btn {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--sidebar-text-muted);
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .cozy-rediscover-btn:hover { border-color: var(--emerald-glow); color: #ffffff; }

        .cozy-nav-section { margin-bottom: 10px; }
        .cozy-nav-section-label {
            color: var(--sidebar-text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 10px 12px 4px;
        }
        /* .cozy-nav-link base layout comes from cozy-components.css; these
         * rules restyle it specifically for the dark sidebar context. */
        .cozy-sidebar .cozy-nav-link {
            color: var(--sidebar-text);
            border-radius: 6px;
            margin: 1px 4px;
        }
        .cozy-sidebar .cozy-nav-link:hover { background: var(--sidebar-hover); color: #ffffff; }
        .cozy-sidebar .cozy-nav-link.active {
            background: var(--sidebar-active-bg);
            color: #ffffff;
            border-left-color: var(--emerald-glow);
            font-weight: 600;
        }

        .cozy-main-wrap { display: flex; flex-direction: column; min-height: 100vh; }

        /* Header bar: brand context lives in the sidebar already, so this
         * status bar plays the "top header" role (search/status/session) —
         * restyled to sit on light background with real contrast, matching
         * the reference header's spirit without fabricating a search box
         * or notification system that isn't real yet. */
        .cozy-status-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 14px 28px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-surface);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .cozy-main { padding: 28px; flex-grow: 1; }
        .cozy-main h2 { font-size: 1.5rem; margin: 0 0 12px; color: var(--text-primary); }
        .cozy-main h3 { color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.03em; }

        .cozy-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .cozy-list > .cozy-nav-link {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
            color: var(--text-primary);
        }
        .cozy-module-row {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: var(--text-primary);
        }
        .cozy-module-row-main {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .cozy-module-row-main b { font-size: 0.95rem; }
        .cozy-module-row-meta {
            display: flex; gap: 18px; flex-wrap: wrap;
            font-size: 0.8rem; color: var(--text-secondary);
        }

        .cozy-grid { display: grid; gap: 16px; margin-top: 12px; }
        .cozy-card-label { color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
        .cozy-card-value { font-size: 1.6rem; font-weight: 700; color: var(--text-primary); }

        .cozy-disclosure-note { color: var(--text-secondary); font-size: 0.8rem; font-style: italic; margin: 4px 0 12px; }

        .cozy-devhub-embedded-nav {
            display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 18px;
            padding: 10px; background: var(--bg-surface); border: 1px solid var(--border-color);
            border-radius: 10px;
        }
        .cozy-devhub-embedded-nav .cozy-nav-item {
            padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; text-decoration: none;
        }
        .cozy-devhub-embedded-nav .cozy-nav-item.active {
            background: var(--sidebar-active-bg); color: #ffffff; font-weight: 600;
        }

        /* --- New: Dashboard hero + stat cards + quick actions, matching
         * the reference design's home layout. Real data only — stat
         * numbers come from actual connected coordinators (Certification's
         * application count, Module Manager's coordinator count, real user
         * count when Identity is connected), never fabricated. --- */
        .cozy-hero {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px 28px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: var(--cozy-glass-shadow, none);
        }
        .cozy-hero h1 { margin: 0 0 4px; font-size: 1.4rem; color: var(--text-primary); }
        .cozy-hero p { margin: 0; color: var(--text-secondary); font-size: 0.9rem; }
        .cozy-hero-status {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(27,94,32,0.1); color: var(--accent-emerald);
            padding: 6px 14px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
        }
        .cozy-hero-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-emerald); display: inline-block; }

        .cozy-stat-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px; margin-bottom: 20px;
        }
        .cozy-stat-card {
            background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px;
            padding: 16px 18px; box-shadow: var(--cozy-glass-shadow, none);
        }
        .cozy-quick-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px;
        }
        .cozy-quick-card {
            background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px;
            padding: 16px; cursor: pointer; transition: border-color 0.15s;
            box-shadow: var(--cozy-glass-shadow, none);
        }
        .cozy-quick-card:hover { border-color: var(--accent-emerald); }
        .cozy-quick-card .cozy-card-label { margin-bottom: 2px; }

        .cozy-feature-card {
            background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px;
            padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--cozy-glass-shadow, none);
        }
        .cozy-feature-card-head {
            display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
        }

        .cozy-shell-footer {
            padding: 16px 28px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
        }

        #terminal-input:focus { border-color: var(--accent-gold); outline: none; }
        #terminal-input, #execute-btn { transition: border-color var(--cozy-transition-fast, 0.15s), background var(--cozy-transition-fast, 0.15s); }
        #terminal-input { background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border-color); }
        #terminal-output { background: #ffffff !important; color: var(--text-secondary) !important; border: 1px solid var(--border-color); }

        /* M346 — real bug fix. cozy-workspace.js uses class="cozy-field" on
         * every real form input/textarea/select it generates (Message
         * Publisher, Living Theme Engine search/filter/sort, Create
         * Administrator, etc. — 15 real usages) but no rule for it existed
         * anywhere in the repository, so every one of those controls was
         * rendering as an unstyled, out-of-place browser default — the
         * likely reason newly added controls looked "not in the UI." Same
         * token-driven convention as .cozy-input (core/ui/cozy-components.css)
         * so it matches the rest of the shell, not a second style system. */
        .cozy-field {
            display: block; width: 100%; max-width: 420px; box-sizing: border-box;
            background: var(--bg-surface); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: 8px;
            padding: 8px 12px; font: inherit; font-size: 0.85rem; margin: 4px 0;
        }
        .cozy-field:focus { outline: none; border-color: var(--accent-emerald); }
        textarea.cozy-field { min-height: 90px; resize: vertical; }
        select.cozy-field { cursor: pointer; }

        /* M346 — Living Theme Engine restructure: filter bar and
         * per-category grouping, using the same card/list tokens as
         * everywhere else in the shell. */
        .cozy-filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
        .cozy-filter-bar .cozy-field { margin: 0; width: auto; flex: 1 1 180px; }
        .cozy-theme-category-group { margin-bottom: 18px; }
        .cozy-theme-category-heading {
            font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text-secondary); margin: 0 0 8px;
        }
        .cozy-color-swatch:hover { transform: scale(1.08); }
    </style>
</head>
<body>

    <!-- Milestone M211F — real, instant emerald launch screen. First
         element in body, no JS required for it to appear. Removed once
         the login gate is actually about to render (see bootstrap
         script below) - never left up indefinitely, never removed
         before real content is ready. -->
    <div id="cozy-launch-screen">
        <img id="cozy-launch-logo" src="assets/branding/cozyoslogo-emblem.png?v=1.13.1" alt="CozyOS">
        <h1 id="cozy-launch-title"></h1>
        <p id="cozy-launch-slogan"></p>
    </div>

    <script src="core/shell/launch-sequence.js"></script>
    <!-- M364.3: the Stage 1-6 sequence itself now lives in the
         single, shared core/shell/launch-sequence.js (extracted
         verbatim from what was here before — zero behavior change),
         so index.html can show the identical approved launch
         experience instead of a second, different one. -->

    <!-- Additive: single mount point for the real Enterprise Control Center
         (core/shell/cozy-workspace.js). Its mount() call builds its own
         sidebar/topbar/main structure inside this div — nothing else in
         this file writes to it directly. -->
    <div id="cozy-workspace-root">
        <noscript>The CozyOS Administrator Workspace requires JavaScript.</noscript>
    </div>

    <!-- CozyOS Shell UI Services (core/ui/). Loaded first: cozy-theme.js
         applies the active theme immediately on construction (reading the
         data-cozy-app="platform-admin" attribute already set on <html>
         above), so it should run before anything else that might read
         theme-dependent CSS variables.
         - cozy-theme.js / cozy-background.js: real, verified compatible,
           but required a new "platform-admin" theme profile to be added
           (see migration log) — without it, both would have defaulted the
           whole Administrator Workspace to Developer Hub's green/gold theme
           and particle background. That gap is now closed: cozy-tokens.css
           has a platform-admin block, cozy-theme.js registers it, and
           cozy-background.js has a dedicated (subtle, emerald/gold mesh)
           scene for it — Developer Hub keeps its own "developer" theme.
         - cozy-toast.js / cozy-live.js: zero risk, no per-app coupling,
           real API verified to match every existing call in
           developer-hub.js and cozy-ui.js exactly (Toast.show(),
           Live.publish()/subscribe()). -->
    <script src="core/ui/cozy-theme.js"></script>
    <script src="core/ui/cozy-background.js"></script>
    <!-- M370.5 — CozyEnvironment. Single, read-only facade over the
         Living Background's real state, available for future
         ChurchOS/ShopOS/Calendar/CozyAI consumers. -->
    <script src="core/living/cozy-environment.js"></script>
    <!-- M350 real fix: core/ui/live-animation-engine.js is a real,
         self-initializing, self-contained file (window.CozyOS.LiveAnimationEngine
         = new CozyLiveAnimationEngine() at its own end) but had no <script>
         tag anywhere in the repository - index.html's startup sequence
         composes it (showTyping/applyAnimation) but it could never actually
         load, so the typed wordmark/tagline/feature-badge reveal silently
         never fired. Placed beside cozy-theme.js/cozy-background.js since
         it has the same "real UI service, no dependencies" shape. -->
    <script src="core/ui/live-animation-engine.js"></script>
    <!-- M350 — Startup Orchestrator: coordinates the above (and LivingAudio)
         for the living startup sequence. Composes only; no engine logic
         lives here. Loaded on dashboard.html too (not just index.html) so
         it is a real, always-available shell service, consistent with
         cozy-theme.js/cozy-background.js above. -->
    <script src="core/shell/startup-orchestrator.js"></script>
    <script src="core/living/cozy-living-particles.js"></script>
    <script src="core/living/cozy-living-sounds.js"></script>
    <script src="core/living/cozy-living-audio.js"></script>
    <script src="core/living/cozy-living-ai.js"></script>
    <script src="core/connectivity/cozy-connect.js"></script>
    <script src="core/connectivity/offline.js"></script>
    <script src="core/living/cozy-living-offline.js"></script>
    <script src="core/shell/cozy-toast.js"></script>
    <script src="core/shell/cozy-live.js"></script>

    <!-- 3. BOOTSTRAP: mount the Workspace Shell once it and its scripts have
         loaded. Bounded retry (same convention already used elsewhere in
         CozyOS, e.g. developer-hub.js's own initStandaloneMount) covers
         defer/script-order timing rather than assuming a fixed load order. -->
    <script>
        (function bootWorkspace() {
            const root = document.getElementById("cozy-workspace-root");
            function tryMount() {
                if (window.CozyOS && window.CozyOS.WorkspaceShell && typeof window.CozyOS.WorkspaceShell.mount === "function") {
                    // Milestone 200A: mount() previously had no error
                    // surfacing anywhere in this chain — a real exception
                    // inside it (or the #render() it calls internally)
                    // would be silently swallowed as an uncaught async
                    // error, leaving the user stuck on the login screen
                    // with no visible feedback. This wrapper changes
                    // nothing architecturally; it only makes a genuine
                    // failure visible instead of silent.
                    try {
                        // Minimal fix: don't resolve the current user's role
                        // before IdentityEngine has finished restoring users
                        // (restorePersistedUsers() is async) — mounting early
                        // makes a genuine admin resolve to role=null and hit
                        // a false "Access Denied", most visible right after
                        // signing into a freshly-created account.
                        const identity = window.CozyOS.IdentityEngine;
                        const identityReady = (identity && identity.ready && typeof identity.ready.then === "function")
                            ? identity.ready
                            : Promise.resolve();
                        identityReady.catch(() => {}).then(() => window.CozyOS.WorkspaceShell.mount(root));
                        return true;
                    } catch (err) {
                        console.error("[CozyOS] WorkspaceShell.mount() threw:", err);
                        root.innerHTML = `<div class="cozy-error-mode" style="max-width:480px;margin:10vh auto;padding:24px;font-family:system-ui,sans-serif;border:1px solid rgba(252,165,165,0.3);border-radius:12px;background:#1a1010;color:#fca5a5;">
                            <h3 style="margin:0 0 8px 0;color:#fff;">CozyOS Workspace failed to load</h3>
                            <p style="margin:0 0 8px 0;font-size:13px;">${(err && err.message) ? err.message.replace(/</g, "&lt;") : "Unknown error."}</p>
                            <p style="margin:0;font-size:12px;color:#f87171;">See browser console for the full stack trace.</p>
                        </div>`;
                        return true; // stop retrying - a real error was surfaced, not a load-order timing gap
                    }
                }
                return false;
            }
            function mountWorkspaceWhenReady() {
                if (tryMount()) return;
                let attempts = 0;
                const intervalId = setInterval(() => {
                    attempts++;
                    if (tryMount() || attempts >= 40) clearInterval(intervalId);
                }, 250);
            }
            // Milestone M211F — remove the real, instant emerald launch
            // screen now that real content (login gate or workspace) is
            // about to render. Fades out smoothly rather than an abrupt
            // removal, then fully removes from the DOM after the
            // transition completes.
            //
            // M364.1 fix: this used to run immediately on script parse
            // (~700ms after page load), completely independent of the
            // launch sequence's own 8-10s animation (Stages 1-6) defined
            // in the earlier <script> block — the login card could
            // appear while the logo/typing/voice/motto sequence was
            // still supposed to be playing. Real fix, using only the
            // existing architecture (PlatformEventBus, already loaded at
            // this point — no new engine): wait for the real
            // "cozy:launch-sequence-complete" event that block now
            // emits at its true completion (end of Stage 6, motto
            // settled). Bounded, honest fallback (12s — safely longer
            // than the ~8s sequence, covering real voice-playback
            // variance) proceeds anyway if the event is somehow never
            // emitted, so a broken signal can never strand the user on
            // the launch screen forever — the same bounded-retry
            // philosophy already used by mountWorkspaceWhenReady() just
            // above. Zero change to any animation timing, visual, or
            // sound in the sequence itself.
            function proceedPastLaunchScreen() {
                const launchScreen = document.getElementById("cozy-launch-screen");
                if (launchScreen) {
                    launchScreen.classList.add("cozy-launch-hidden");
                    setTimeout(() => launchScreen.remove(), 700);
                }
                const startupOrchestrator = window.CozyOS && window.CozyOS.StartupOrchestrator;
                if (startupOrchestrator && typeof startupOrchestrator.restoreDefaultScene === "function") {
                    startupOrchestrator.restoreDefaultScene();
                }
                if (window.CozyOS && window.CozyOS.LoginGate && typeof window.CozyOS.LoginGate.mountIfNeeded === "function") {
                    window.CozyOS.LoginGate.mountIfNeeded(root, mountWorkspaceWhenReady);
                } else {
                    mountWorkspaceWhenReady();
                }
            }

            const bus = window.CozyOS && window.CozyOS.PlatformEventBus;
            if (bus && typeof bus.once === "function") {
                let proceeded = false;
                const proceedOnce = () => { if (proceeded) return; proceeded = true; proceedPastLaunchScreen(); };
                bus.once("cozy:launch-sequence-complete", proceedOnce);
                setTimeout(proceedOnce, 12000); // honest, bounded fallback — never hangs forever if the signal is somehow never emitted
            } else {
                // PlatformEventBus genuinely unavailable — honest fallback
                // to the prior immediate behavior rather than hanging.
                proceedPastLaunchScreen();
            }
        })();
    </script>
